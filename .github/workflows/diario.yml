name: short-diario

# Todo dia às 5h de Brasília (8:00 UTC) gera o Short e agenda no Buffer para 11h.
# O cron do GitHub pode atrasar (já atrasou mais de 5h); com 6h de folga, o vídeo fica pronto antes do horário.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Agendar no Buffer (false = so testar a geracao)'
        default: 'true'

permissions:
  contents: write

concurrency:
  group: short-diario
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      FISH_VOICE: ${{ secrets.FISH_VOICE }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      N8N_AVISO_URL: ${{ secrets.N8N_AVISO_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            curl -sfL --retry 3 --max-time 240 -o /tmp/ff.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && break
            echo "download do ffmpeg falhou (tentativa $i)"; sleep 10
          done
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo "/tmp/ff/bin" >> "$GITHUB_PATH"
          for i in 1 2 3; do timeout 300 pip install -q --retries 5 --timeout 30 faster-whisper pillow numpy && break; sleep 15; done

      - name: Roteiro (Gemini escreve, gpt-5 revisa)
        run: python3 escrever_roteiro.py out

      - name: Imagens (Flux 3 Klein + checagem Gemini) e voz
        run: python3 gerar_cenas.py out flux

      - name: Montar o video
        run: |
          cp assets/trilha.mp3 out/musica.mp3
          python3 render_short.py out

      # Branch "videos" sem historico: guarda os 5 videos mais recentes, servidos pelo GitHub Pages
      - name: Publicar no branch videos
        id: pub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOME="$(TZ=America/Sao_Paulo date +%Y%m%d-%H%M).mp4"
          mkdir -p /tmp/pub
          if git fetch -q origin videos; then git archive FETCH_HEAD | tar -x -C /tmp/pub; fi
          cp out/short.mp4 "/tmp/pub/$NOME"
          cd /tmp/pub
          ls *.mp4 | sort | head -n -5 | xargs -r rm -f
          git init -q -b videos
          git config user.name "bvamr-render"
          git config user.email "actions@github.com"
          git add -A && git commit -q -m "video $NOME"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" videos
          echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/$NOME" >> "$GITHUB_OUTPUT"

      - name: Esperar o GitHub Pages
        run: |
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' '${{ steps.pub.outputs.url }}')" = "200" ] && exit 0
            sleep 15
          done
          echo "Pages nao publicou o video em 10 min"; exit 1

      - name: Agendar no Buffer (YouTube e TikTok, 11h)
        if: github.event_name == 'schedule' || inputs.publicar == 'true'
        run: python3 publicar.py out "${{ steps.pub.outputs.url }}" | tee out/buffer.json

      - name: Guardar roteiro, fila e historico
        if: github.event_name == 'schedule' || inputs.publicar == 'true'
        run: |
          mkdir -p roteiros
          cp out/roteiro.json "roteiros/$(TZ=America/Sao_Paulo date +%Y%m%d).json"
          git config user.name "bvamr-render"
          git config user.email "actions@github.com"
          git add temas.md historico.csv roteiros
          git commit -q -m "short $(TZ=America/Sao_Paulo date +%d/%m)" && git push -q

      - name: Guardar arquivos do dia (para conferir)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: |
            out/roteiro.json
            out/img
          retention-days: 7

      # Aviso no Slack (via n8n): roteiro do dia para ler antes das 11h, ou o erro com o link da execucao
      - name: Avisar no Slack
        if: always()
        env:
          STATUS: ${{ job.status }}
          VIDEO: ${{ steps.pub.outputs.url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLICAR: ${{ github.event_name == 'schedule' || inputs.publicar == 'true' }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          st, run = os.environ["STATUS"], os.environ["RUN"]
          if st == "success":
              r = json.load(open("out/roteiro.json"))
              falas = " ".join(c["fala"] for c in r["cenas"])
              quando = "agendado para 11h no YouTube e no TikTok" if os.environ["PUBLICAR"] == "true" else "TESTE: nao foi publicado"
              txt = (f":clapper: *Bem-vindo ao Mundo Real*: {r['titulo']}\n{quando}\nVideo: {os.environ['VIDEO']}\n"
                     f"{len(r['cenas'])} cenas, {len(falas.split())} palavras\n\n>{falas}")
          else:
              txt = f":rotating_light: *Bem-vindo ao Mundo Real*: o Short de hoje falhou ({st}). Veja: {run}"
          req = urllib.request.Request(os.environ["N8N_AVISO_URL"], json.dumps({"text": txt}).encode(), {"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=30).status)
          PY
